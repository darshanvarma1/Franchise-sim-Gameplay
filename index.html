<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gridiron GM - 3D Football Engine</title>
    <meta name="description" content="Playable 3D physics-driven American football gameplay engine prototype featuring active ragdolls, ballistic spirals, and tactical play calling." />
    <meta property="og:title" content="Gridiron GM - 3D Football Engine" />
    <meta property="og:description" content="Playable 3D physics-driven American football gameplay engine prototype featuring active ragdolls, ballistic spirals, and tactical play calling." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // The preferred GitHub Pages workflow serves Vite's dist/ artifact. If the
      // repository's legacy branch publisher runs afterward, boot the checked-in
      // production bundle instead of attempting to execute TypeScript in-browser.
      const rawSourceEntry = document.querySelector(
        'script[type="module"][src$="/src/main.tsx"]',
      );
      const runningFromSourcePage = !import.meta.url.includes('/assets/')
        && !import.meta.url.includes('/pages-assets/');
      if (rawSourceEntry && runningFromSourcePage && window.location.hostname.endsWith('.github.io')) {
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = './pages-assets/app.css?v=mobile-controls-1';
        document.head.appendChild(stylesheet);

        const pagesBundle = './pages-assets/app.js?v=mobile-controls-1';
        import(/* @vite-ignore */ pagesBundle).catch((error) => {
          console.error('Unable to load the GitHub Pages gameplay bundle.', error);
        });
      }
    </script>
  </body>
</html>
